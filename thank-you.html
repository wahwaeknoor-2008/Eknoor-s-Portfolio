<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff5d9">
  <title>Message received — Eknoor Wadhwa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body{min-height:100svh;display:grid;place-items:center;padding:24px}
    .thanks{width:min(620px,100%);padding:clamp(28px,6vw,56px);border:1.5px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:10px 10px 0 var(--yellow);text-align:center}
    .thanks-mark{width:64px;height:64px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;background:var(--mint);color:var(--ink);font-size:2rem}
    h1{font:700 clamp(2.2rem,7vw,4rem)/1 var(--display);letter-spacing:-.06em}
    p{margin:18px auto 26px;max-width:440px;color:var(--muted);line-height:1.7}
    a{display:inline-flex;align-items:center;gap:10px;padding:13px 18px;border-radius:12px;background:var(--ink);color:white;font-weight:700}
  </style>
</head>
<body>
  <main class="thanks">
    <div class="thanks-mark" aria-hidden="true">✓</div>
    <p class="eyebrow" style="justify-content:center">MESSAGE RECEIVED</p>
    <h1>Thanks for reaching out.</h1>
    <p>Your message has been submitted. I appreciate you taking the time to get in touch and will respond as soon as I can.</p>
    <a href="https://eknoorwadhwa.com/">Back to my portfolio <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
