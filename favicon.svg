<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Eknoor Wadhwa — Developer favicon</title>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5d9"/>
      <stop offset="1" stop-color="#d8f5f2"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#23ad9d"/>
    </linearGradient>
  </defs>
  <!-- Original portfolio palette: ink, paper, yellow, coral and teal -->
  <rect x="4" y="4" width="120" height="120" rx="29" fill="#17233c"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="28.5" fill="none" stroke="#fffdf7" stroke-opacity=".22" stroke-width="1.5"/>
  <!-- laptop screen -->
  <path d="M27 31.5Q27 25 34 25h60q7 0 7 6.5v49H27z" fill="url(#screen)" stroke="#fffdf7" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M21 86h86l-7 10H28z" fill="#71a9ff" stroke="#fffdf7" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M51 91h26" stroke="#17233c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- code brackets -->
  <path d="m43 46-9 8 9 8M85 46l9 8-9 8" fill="none" stroke="#23ad9d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bold E monogram -->
  <path d="M57 42h22v7H64v6h13v7H64v6h15v7H57z" fill="#17233c"/>
  <!-- orbit / innovation trail -->
  <path d="M23 79c16 8 43 4 66-12 11-8 17-16 17-22" fill="none" stroke="url(#orbit)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="106" cy="43" r="6.5" fill="#ff6e61" stroke="#fffdf7" stroke-width="2"/>
  <!-- pixel fragments -->
  <rect x="42" y="34" width="5" height="5" rx="1" fill="#f7c948"/>
  <rect x="36" y="40" width="4" height="4" rx=".8" fill="#ff6e61"/>
  <rect x="45" y="68" width="4" height="4" rx=".8" fill="#f7c948"/>
</svg>
